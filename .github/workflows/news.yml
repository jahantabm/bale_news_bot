
name: Jahantab Telegram to Bale and Rubika Bridge

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: jahantab-telegram-bridge
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
      BALE_CHAT_ID: ${{ vars.BALE_CHAT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_USERNAME: "jahantab_news"
      RUBIKA_BOT_TOKEN: ${{ secrets.RUBIKA_BOT_TOKEN }}
      RUBIKA_CHAT_ID: ${{ vars.RUBIKA_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check required configuration
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ vars.BALE_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          RUBIKA_BOT_TOKEN: ${{ secrets.RUBIKA_BOT_TOKEN }}
          RUBIKA_CHAT_ID: ${{ vars.RUBIKA_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          required = [
              "BALE_BOT_TOKEN",
              "BALE_CHAT_ID",
              "TELEGRAM_BOT_TOKEN",
              "RUBIKA_BOT_TOKEN",
              "RUBIKA_CHAT_ID",
          ]
          missing = [
              key for key in required
              if not os.environ.get(key, "").strip()
          ]
          if missing:
              raise SystemExit(
                  "Missing GitHub Actions variables/secrets: "
                  + ", ".join(missing)
              )
          print("Configuration check passed.")
          PY

      - name: Run Telegram to Bale and Rubika bridge
        run: python bot.py

      - name: Save bridge state
        if: always()
        run: |
          git config user.name "jahantab-news-bot"
          git config user.email "actions@users.noreply.github.com"

          git add -f telegram_offset.json delivery_state.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No state changes to save."
          else
            git commit -m "Update Telegram bridge state"
            git push
          fi
