name: Jahantab Bale News Bot

on:
  workflow_dispatch:
  schedule:
- cron: "*/5 * * * *"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
      BALE_CHAT_ID: ${{ vars.BALE_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run news bot
        run: python bot.py

      - name: Save sent-news state
        run: |
          git config user.name "jahantab-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sent_links.txt
          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "Update sent news state"
            git push
          fi
