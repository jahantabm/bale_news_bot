name: Jahantab Telegram to Bale Bridge

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: jahantab-bale-news-bridge
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
      BALE_CHAT_ID: ${{ vars.BALE_CHAT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_USERNAME: "jahantab_news"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Telegram to Bale bridge
        run: python bot.py

      - name: Save Telegram bridge state
        run: |
          git config user.name "jahantab-news-bot"
          git config user.email "actions@users.noreply.github.com"

          git add -A telegram_offset.json

          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "Update Telegram bridge state"
            git push
          fi